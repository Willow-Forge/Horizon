  if(asOf&&canSettings()&&!DOC.tenant.demo){const days=Math.floor((Date.now()-new Date(asOf+"T12:00:00").getTime())/864e5);
    if(days>PRODUCT.staleDays)showBanner("caution",`Balances are from <b>${esc(fmtDay(asOf))}</b>, ${days} days ago.`,[["Update balances",()=>openSettings("balances")]],"stale-"+TID);}
  if(r==="viewer"&&SB.token)showBanner("info",`You're signed in as <b>${esc(SB.email)}</b> and can view this plan. Editors are added by the district's administrator.`,[["Request edit access",requestAccess]],"noedit-"+TID);
  if(SB.legacy&&canSettings())showBanner("info","This plan was read from the previous shared table. The next save moves it to the new one.",[],"legacy");
  sinceLastVisit();
}
function sinceLastVisit(){
  const key=LS_SEEN+TID,seen=lsGet(key),me=(SB.email||"").toLowerCase();
  if(seen&&seen.at&&!DOC.tenant.demo){
    const ch=DOC.scenarios.filter(s=>s.savedAt&&s.savedAt>seen.at&&String(s.savedBy||"").toLowerCase()!==me);
    if(ch.length){const list=ch.slice(0,3).map(s=>`<b>${esc(s.name)}</b> saved ${esc(fmtDay(s.savedAt.slice(0,10)))}${s.savedBy?" by "+esc(s.savedBy.split("@")[0]):""}`).join("; ");
      showBanner("info",`Since your last visit: ${list}${ch.length>3?`, and ${ch.length-3} more`:""}.`,[["Compare",openCompare]],"since-"+TID);}
  }
  lsSet(key,{at:nowIso()});
}

/* ================= full-page screens ================= */
let SCREEN=null;
const SIGNIN={state:"form",email:"",until:0,msg:""};
function showScreen(kind){
  SCREEN=kind;closeMenu();closeDrawer();
  $("planview").hidden=true;$("topbar").hidden=true;$("tabbar").hidden=true;$("ribbon").hidden=true;
  const el=$("screen");el.hidden=false;
  el.innerHTML=kind==="signin"?signinHtml():kind==="landing"?landingHtml():kind==="newdistrict"?newDistrictHtml():notFoundHtml();
  wireScreen(kind);window.scrollTo(0,0);
  const f=el.querySelector("h1");if(f){f.setAttribute("tabindex","-1");f.focus();}
}
function hideScreen(){if(!SCREEN)return;SCREEN=null;$("screen").hidden=true;$("screen").innerHTML="";$("planview").hidden=false;$("topbar").hidden=false;$("tabbar").hidden=false;render();}
function signinHtml(){
  const s=SIGNIN,known=DOC&&DOC.settings.onboarded,d=SET.district;
  const wait=Math.max(0,Math.ceil((s.until-Date.now())/1000));
  let st="";
  if(s.state==="sent")st=`<div class="state ok"><b>Check your inbox.</b> We sent a sign-in link to ${esc(s.email)}. It works once, within an hour. Open it on this device.</div>`;
  if(s.state==="limit")st=`<div class="state warn"><b>Too many sign-in emails this hour.</b> The mail service allows two an hour. A link you already received still works; otherwise try again after ${esc(new Date(s.until).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}))}.</div>`;
  if(s.state==="expired")st=`<div class="state err"><b>That sign-in link has expired or was already used.</b> Send yourself a new one.</div>`;
  if(s.state==="error")st=`<div class="state err"><b>Couldn't send the link.</b> ${esc(s.msg)}</div>`;
  if(s.msg&&s.state==="form")st=`<div class="state warn">${esc(s.msg)}</div>`;
  if(SB.checked&&!SB.on&&s.state!=="sent")st+=`<div class="state err"><b>Can't reach the shared plan right now.</b> ${esc(SB.note||"")} Store: ${esc(SUPABASE_URL)}</div>`;
  const oauth=(PRODUCT.oauth||[]).map(p=>`<button class="btn" data-oauth="${esc(p)}" style="margin-bottom:8px">Continue with ${p==="azure"?"Microsoft":p[0].toUpperCase()+p.slice(1)}</button>`).join("");
  return `<div class="screen"><div class="sbox">
    ${known?(d.logo?`<img class="lg" src="${esc(d.logo)}" alt="">`:`<div class="lg mono" aria-hidden="true">${esc(initials(d.short||d.name))}</div>`):""}
    <h1>${known?esc(d.name):esc(PRODUCT.name)}</h1><p class="sub">${known?`Capital plan · ${YEARS[0].fy}–${YEARS[N-1].fy}`:"Sign in to your district"}</p>
    ${known?`<button class="btn primary" id="si-view">View the plan</button><div class="or">Editors</div>`:""}
    ${st}
    ${oauth}${oauth?'<div class="or">or by email</div>':""}
    <label class="sr" for="si-email">School email</label>
    <input type="email" id="si-email" autocomplete="email" inputmode="email" placeholder="${esc(d.emailHint||"you@district.org")}" value="${esc(s.email)}">
    <button class="btn ${known?"":"primary"}" id="si-send" ${wait?"disabled":""}>${wait?`Send again in ${wait}s`:s.state==="sent"?"Send another link":"Email me a sign-in link"}</button>
    <p class="fine">No password. Board members and the public don't need an account to view the plan.</p>
    ${known?"":`<button class="linkbtn" id="si-back">Back</button>`}
  </div></div>`;
}
let SI_TIMER=0;
function wireScreen(kind){
  const on=(id,fn)=>{const b=$(id);if(b)b.onclick=fn;};
  if(kind==="signin"){
    on("si-view",()=>{SIGNIN.state="form";SIGNIN.msg="";hideScreen();});
    on("si-back",()=>{if(DOC.settings.onboarded)hideScreen();else route();});
    const em=$("si-email");em.onkeydown=e=>{if(e.key==="Enter")$("si-send").click();};
    on("si-send",async()=>{
      const v=(em.value||"").trim();SIGNIN.email=v;
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){SIGNIN.state="form";SIGNIN.msg="Enter your full school email address.";showScreen("signin");return;}
      $("si-send").disabled=true;$("si-send").textContent="Sending…";
      try{await sbSendLink(v);SIGNIN.state="sent";SIGNIN.msg="";SIGNIN.until=Date.now()+60000;}
      catch(e){const m=(e&&e.message)||String(e);
        if(/rate.?limit|429|over_email_send_rate/i.test(m)){SIGNIN.state="limit";SIGNIN.until=Date.now()+3600000;}
        else if(/seconds|60/.test(m)&&/security/i.test(m)){SIGNIN.state="sent";SIGNIN.until=Date.now()+60000;}
        else{SIGNIN.state="error";SIGNIN.msg=m.slice(0,160);}}
      showScreen("signin");
      clearInterval(SI_TIMER);SI_TIMER=setInterval(()=>{if(SCREEN!=="signin"||Date.now()>SIGNIN.until){clearInterval(SI_TIMER);if(SCREEN==="signin")showScreen("signin");return;}
        const b=$("si-send");if(b&&SIGNIN.state!=="limit"){const w=Math.ceil((SIGNIN.until-Date.now())/1000);b.textContent=`Send again in ${w}s`;b.disabled=true;}},1000);});
    document.querySelectorAll("[data-oauth]").forEach(b=>b.onclick=()=>{location.href=SB.url+"/auth/v1/authorize?provider="+encodeURIComponent(b.dataset.oauth)+"&redirect_to="+encodeURIComponent(location.href.split("#")[0]);});
  }
  if(kind==="landing"){
    const d=lsGet(LS_DRAFT);
    on("ld-resume",()=>{hideScreenQuiet();openWizard(null,true);});
    on("ld-upload",()=>{lsDel(LS_DRAFT);hideScreenQuiet();openWizard("upload");});
    on("ld-questions",()=>{lsDel(LS_DRAFT);hideScreenQuiet();openWizard("questions");});
    on("ld-demo",()=>switchTenant(PRODUCT.defaultTenant));
    on("ld-ptpl",()=>downloadText("project_template.csv",projectTemplate(fyOfDate(todayIso()))));
    on("ld-btpl",()=>downloadText("balance_template.csv",balanceTemplate()));
    on("ld-cancel",()=>{if(DOC.settings.onboarded)hideScreen();else switchTenant(PRODUCT.defaultTenant);});
    on("ld-signin2",()=>showScreen("signin"));
    on("ld-invgo",async()=>{const em=($("ld-inv").value||"").trim().toLowerCase();
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){$("ld-invmsg").textContent="Enter a full email address.";return;}
      try{await sbInsert(SB_MEMBERS,{tenant_id:SETUP_TARGET,email:em,role:"admin"});$("ld-invmsg").textContent=`${em} added. Send them ${districtLink()}`;}
      catch(e){$("ld-invmsg").textContent="Couldn't add: "+e.message;}});
    void d;
  }
  if(kind==="newdistrict"){
    const go=()=>{const v=slug($("nd-id").value);if(!v){$("nd-err").textContent="Use letters, numbers and dashes.";return;}
      if(SEED[v]){$("nd-err").textContent="That ID is taken by a demo.";return;}
      location.href=location.pathname+"?d="+encodeURIComponent(v);};
    on("nd-go",go);$("nd-id").onkeydown=e=>{if(e.key==="Enter")go();};on("nd-back",()=>hideScreen());
  }
  if(kind==="notfound"){
    on("nf-demo",()=>switchTenant(PRODUCT.defaultTenant));
    on("nf-new",()=>newDistrict());
    on("nf-signin",()=>showScreen("signin"));
  }
}
/* the wizard opens over the plan area; keep the screen hidden without re-rendering a blank district */
function hideScreenQuiet(){SCREEN=null;$("screen").hidden=true;$("screen").innerHTML="";$("planview").hidden=false;$("topbar").hidden=false;$("tabbar").hidden=false;}
function landingHtml(){
  const d=lsGet(LS_DRAFT),w=d&&d.W,steps=[["district","District name, logo and colour","2 min"],["balances","Fund balances — upload or type","5 min"],["revenue","Revenue and levies","5 min"],["debt","Debt payments","3 min"],["projects","Project list — upload or type","5 min"]];
  const doneTo=d?["district","balances","revenue","debt","projects","review"].indexOf(d.tab):-1;
  const ex=previewFor(SEED["demo-small"].settings,SEED["demo-small"].projects);
  const target=SETUP_TARGET?`<b>${esc(SETUP_TARGET)}</b>`:"your district";
  const t=(k,v)=>`<div class="tile"><div class="k">${k}</div><div class="v">${v}</div></div>`;
  return `<div class="screen"><div class="landing">
    <div><h1>Set up ${SETUP_TARGET?"the capital plan for "+target:"your capital plan"}</h1>
      <p class="lead">About 20 minutes. Your progress saves on this computer as you go, so you can stop and come back.</p>
      <ol class="checklist">${steps.map((s,i)=>`<li><span class="dot ${i<doneTo?"on":""}">${i<doneTo?"✓":""}</span>${s[1]}<span class="t">${s[2]}</span></li>`).join("")}</ol>
      ${sbConfigured()&&!sharedWriter()?`<div class="note warn" style="margin-top:0">Sign in as this district's administrator to set it up. Setup saves to the shared plan, so the whole board sees the same thing.</div>
        <button class="path rec" id="ld-signin2"><b>Sign in</b><span>No password — we email you a link.</span></button>`:""}
      ${SB.starAdmin&&SETUP_TARGET?`<div class="qa"><h4>Or hand setup to the district</h4><p style="margin:0 0 8px;font-size:13px">Add the district's administrator. They sign in with the link and see this screen.</p>
        <label class="sr" for="ld-inv">Administrator's email</label><input id="ld-inv" type="email" placeholder="superintendent@district.org" style="width:100%;border:1px solid var(--line2);border-radius:7px;padding:8px;min-height:40px;background:var(--panel)">
        <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button class="btn sm primary" id="ld-invgo">Add as administrator</button><span class="muted" id="ld-invmsg" style="font-size:13px"></span></div></div>`:""}
      ${!sbConfigured()||sharedWriter()?`${d?`<button class="path rec" id="ld-resume"><b>Continue setup</b><span>${w&&w.district&&w.district.name?esc(w.district.name)+" · ":""}saved ${esc(fmtWhen(d.at))}</span></button>`:""}
      <button class="path ${d?"":"rec"}" id="ld-upload"><b>Upload spreadsheets</b><span>Fastest. Fill in the two templates, then upload them — the questions that are left take a few minutes.</span></button>
      <button class="path" id="ld-questions"><b>Answer the questions</b><span>One step at a time, with helpers for SAVE per pupil and PPEL rates.</span></button>
      `:""}
      <button class="path" id="ld-demo"><b>Explore a demo district first</b><span>Three made-up districts — small, medium and large.</span></button>
      <p class="muted" style="font-size:13px">Templates: <button class="linkbtn" id="ld-ptpl">project list (CSV)</button> · <button class="linkbtn" id="ld-btpl">fund balances (CSV)</button></p>
      <p class="muted" style="font-size:13px">After setup, add your business manager as an editor under Settings → People and send them the balances link, so monthly close-outs go straight in.</p>
      <button class="linkbtn" id="ld-cancel">Not now</button>
    </div>
    <div class="pvcard" aria-label="Example of what you'll get"><div class="k muted" style="font-size:12px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin-bottom:8px">What you'll get · example district, 340 students</div>
      ${ex?`<div class="summary">${t("Ten-year need",fmtK(ex.need))}${t("Levies & grants",fmtK(ex.cap))}${t(ex.gap>0?"Gap to close":"Fits capacity",ex.gap>0?fmtK(ex.gap):"✓")}${t("Plan",`FY${ex.start}–${String(ex.end).slice(2)}`)}</div>`:""}
      <p class="muted" style="font-size:13px;margin-top:10px">Then a year-by-year view of every project, what each year's levies can cover, what-if levers for a V-PPEL vote or slower SAVE receipts, and saved scenarios the board can compare.</p></div>
  </div></div>`;
}
function newDistrictHtml(){
  return `<div class="screen"><div class="sbox" style="text-align:left"><h1>New district</h1>
    <p class="sub">Pick the ID that goes in the district's link. Short, lowercase, no spaces — for example <b>westharrison</b>.</p>
    <label for="nd-id" style="font-weight:600;font-size:13px">District ID</label>
    <input id="nd-id" type="email" style="margin-top:4px" placeholder="westharrison" autocapitalize="off" spellcheck="false">
    <div id="nd-err" style="color:var(--warn);font-size:13px;min-height:18px"></div>
    <button class="btn primary" id="nd-go">Continue</button>
    <p class="fine">On the next screen you can set it up yourself, or add the district's administrator so they can.</p>
    <button class="linkbtn" id="nd-back">Cancel</button></div></div>`;
}
function notFoundHtml(){
  return `<div class="screen"><div class="sbox"><h1>We can't find that district</h1>
    <p class="sub">There's no plan called <b>${esc(TID)}</b>. Check the link, or ask your district for a new one.</p>
    <button class="btn primary" id="nf-demo">Explore a demo district</button>
    ${sbConfigured()&&!SB.token?`<button class="btn" id="nf-signin">I'm this district's administrator — sign in</button>`:SB.token?`<p class="fine">Signed in as ${esc(SB.email)}. If you're this district's administrator, ask for it to be added under your email.</p>`:""}
  </div></div>`;
}

/* ================= plan files and share links ================= */
document.body.insertAdjacentHTML("beforeend",'<input type="file" id="planfile" accept=".json,application/json" hidden aria-label="Plan file">');
const b64u=b=>{let s="";for(let i=0;i<b.length;i+=8192)s+=String.fromCharCode(...b.subarray(i,i+8192));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");};
const unb64u=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");const raw=atob(s);const out=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);return out;};
async function gzip(bytes){const cs=new CompressionStream("gzip");const w=cs.writable.getWriter();w.write(bytes);w.close();return new Uint8Array(await new Response(cs.readable).arrayBuffer());}
async function gunzip(bytes){const ds=new DecompressionStream("gzip");const w=ds.writable.getWriter();w.write(bytes);w.close();return new Uint8Array(await new Response(ds.readable).arrayBuffer());}
function exportDoc(){const d=clone(DOC);const t=d.scenarios.find(x=>x.id===viewId);
  if(t&&!t.locked&&isDirty())Object.assign(t,workingPlan());d.exportedAt=nowIso();return d;}
function adoptPlan(obj){
  if(!obj||!Array.isArray(obj.scenarios))throw new Error("no scenarios in that file");
  let d;
  if(obj.v===3&&obj.settings)d=Object.assign(clone(obj),{tenant:Object.assign({},DOC.tenant,{id:TID})});
  else d=Object.assign(clone(DOC),{scenarios:obj.scenarios,activeId:obj.activeId});
  DOC=normalizeDoc(d,TID);
  if(!DOC.scenarios.length)throw new Error("no usable scenarios in that file");
  viewId=DOC.activeId;loadInto(scById(viewId));ERRMSG="";FILEDIRTY=true;syncLevers();render();
}
const planName=()=>slug(SET.district.short||SET.district.name||TID)+"_CIP_plan_"+todayIso()+".json";
function downloadPlan(){const name=planName();
  if(downloadText(name,JSON.stringify(exportDoc(),null,1),"application/json")){FILEDIRTY=false;toast("Downloaded "+name+".");}
  else toast("This browser blocked the download.");}
let RESTORE=false;
$("planfile").onchange=async e=>{const f=e.target.files&&e.target.files[0];e.target.value="";if(!f)return;
  const before=clone(DOC);
  try{adoptPlan(JSON.parse(await f.text()));
    showBanner("caution",`Showing <b>${esc(f.name)}</b> — ${DOC.scenarios.length} scenario${DOC.scenarios.length===1?"":"s"}. Nothing is saved yet.`,
      [["Save it for everyone",()=>publishDoc(()=>{},null,"Restored from "+f.name)],["Cancel",()=>{DOC=normalizeDoc(before,TID);viewId=DOC.activeId;loadInto(scById(viewId));syncLevers();render();}]],"restore");}
  catch(err){showBanner("err",`That isn't a backup file (${esc((err&&err.message)||"unreadable")}).`,[],"badfile");}
  RESTORE=false;};
async function loadFromHash(){
  const m=/[#&]plan=([A-Za-z0-9\-_]+)/.exec(location.hash||"");if(!m)return false;
  try{const kind=m[1][0],bytes=unb64u(m[1].slice(1));const raw=(kind==="g")?await gunzip(bytes):bytes;
    adoptPlan(JSON.parse(new TextDecoder().decode(raw)));showBanner("info","Opened from a shared link — a snapshot, not the live plan.",[["Show the live plan",()=>location.replace(districtLink())]],"snap");return true;}
  catch(e){showBanner("err","That shared link couldn't be read.",[],"badsnap");return false;}
}

/* ================= boot ================= */
(async()=>{
  const q=new URLSearchParams(location.search);
  let id=q.get("d");
  if(!id){const m=/[#&]d=([\w-]+)/.exec(location.hash||"");if(m)id=m[1];}
  id=slug(id||"")||lsGet(LS_LAST)||PRODUCT.defaultTenant;
  const task=q.get("task");
  const herr=sbConfigured()?sbHashError():null;
  openTenant(id);
  if(sbConfigured()){try{await sbSignIn();}catch(e){}}
  await sbBootTenant();
  route();
  if(herr){SIGNIN.state=herr.code==="otp_expired"?"expired":"error";SIGNIN.msg=herr.code==="otp_expired"?"":herr.text;showScreen("signin");}
  else if(task==="balances"&&DOC.settings.onboarded){
    if(canSettings()&&(ROLE()!=="local"||!SB.on))openSettings("balances");
    else if(sbConfigured()&&SB.on&&!SB.token){SIGNIN.state="form";SIGNIN.msg="Sign in to update the fund balances.";showScreen("signin");}
    else if(canSettings())openSettings("balances");
  }
  const want=q.get("s");
  if(want&&DOC.settings.onboarded&&scById(want)&&want!==viewId)doSwitch(want);
  await loadFromHash();
  if(!SCREEN&&DOC.settings.onboarded&&!ADMIN.open)startTour(false);
})();
</script>
