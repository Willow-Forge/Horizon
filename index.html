<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Capital plan</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F6F2; --panel:#FFFFFF; --sunk:#F0EEE8; --ink:#1B1A22; --muted:#5E5C67; --faint:#76737E;
  --line:#E2DFD6; --line2:#CFCBBF;
  --brand:#4F2170; --brand-ink:#4F2170; --on-brand:#FFFFFF; --brand-soft:#F3EEF8; --brand-ink-dk:#C9A8EA; --brand-soft-dk:#2B2433;
  --save:#2F5A8F; --ppel:#1D6B6B; --vppel:#6A4C9C; --grants:#7A5A00; --boost:#A2560C; --camp:#A1352F;
  --ok:#2C6E3F; --ok-soft:#E5F1E8; --warn:#A1352F; --warn-soft:#F9E8E6; --caution:#8A5A0B; --caution-soft:#FBF0DC; --info:#2F5A8F; --info-soft:#E7EEF7;
  --disp:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --t12:12px;--t13:13px;--t15:15px;--t18:18px;--t24:24px;--t32:32px;
  --r:8px; --shadow:0 8px 30px rgba(20,18,30,.16);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --paper:#15151A;--panel:#1E1E24;--sunk:#18181D;--ink:#ECEAF2;--muted:#ABA8B4;--faint:#9491A0;--line:#312F38;--line2:#45434E;
  --brand-ink:var(--brand-ink-dk);--brand-soft:var(--brand-soft-dk);
  --ok:#8FCB9E;--ok-soft:#1C3023;--warn:#F0958C;--warn-soft:#3A2220;--caution:#E6B869;--caution-soft:#3A2E1A;--info:#95B9E3;--info-soft:#1D2A3A;
  --shadow:0 8px 30px rgba(0,0,0,.5);}}
:root[data-theme="dark"]{color-scheme:dark;
  --paper:#15151A;--panel:#1E1E24;--sunk:#18181D;--ink:#ECEAF2;--muted:#ABA8B4;--faint:#9491A0;--line:#312F38;--line2:#45434E;
  --brand-ink:var(--brand-ink-dk);--brand-soft:var(--brand-soft-dk);
  --ok:#8FCB9E;--ok-soft:#1C3023;--warn:#F0958C;--warn-soft:#3A2220;--caution:#E6B869;--caution-soft:#3A2E1A;--info:#95B9E3;--info-soft:#1D2A3A;
  --shadow:0 8px 30px rgba(0,0,0,.5);}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:var(--t15);line-height:1.45;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--brand-ink);outline-offset:2px}
h1,h2,h3,.num,.disp{font-family:var(--disp)}
.num{font-variant-numeric:tabular-nums}
button,select,input,textarea{font:inherit;color:inherit}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;font-family:var(--disp);font-weight:600;font-size:var(--t15);letter-spacing:.02em;border:1px solid var(--line2);background:var(--panel);color:var(--ink);border-radius:7px;padding:6px 14px;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--sunk)}
.btn:disabled{color:var(--faint);background:var(--sunk);border-color:var(--line);cursor:default}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover:not(:disabled){filter:brightness(.9);background:var(--brand)}
.btn.primary:disabled{background:var(--sunk);border-color:var(--line);color:var(--faint);filter:none}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover:not(:disabled){background:var(--sunk)}
.btn.sm{min-height:30px;font-size:var(--t13);padding:4px 10px}
.linkbtn{background:none;border:none;color:var(--brand-ink);font-weight:600;cursor:pointer;padding:4px 2px;min-height:24px;text-decoration:underline;text-underline-offset:2px}
@media (pointer:coarse){.btn{min-height:44px}.btn.sm{min-height:40px}}
/* ---------- ribbon + top bar ---------- */
.ribbon{background:var(--caution-soft);color:var(--caution);font-size:var(--t13);font-weight:600;display:flex;gap:10px;align-items:center;justify-content:center;padding:6px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.ribbon .linkbtn{color:var(--caution)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--panel);border-bottom:1px solid var(--line)}
.tb{max-width:1760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 20px;flex-wrap:wrap}
.ident{display:flex;align-items:center;gap:10px;min-width:0;background:none;border:none;padding:4px 6px;border-radius:8px;cursor:pointer;text-align:left}
.ident:hover{background:var(--sunk)}
.ident > span{min-width:0}
.ident img{width:36px;height:36px;object-fit:contain;border-radius:6px;flex:none}
.ident .mono{width:36px;height:36px;border-radius:6px;background:var(--brand);color:var(--on-brand);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:18px;flex:none}
.ident .nm{display:block;font-family:var(--disp);font-weight:700;font-size:var(--t18);line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:42vw}
.ident .sub{display:block;font-size:var(--t12);color:var(--muted)}
.tbsp{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:var(--t13);background:var(--sunk);white-space:nowrap;min-height:30px;cursor:default}
button.chip{cursor:pointer}
.chip .d{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.chip.dirty .d{background:var(--caution)} .chip.err .d{background:var(--warn)} .chip.off .d{background:var(--faint)} .chip.busy .d{background:var(--info)}
.statusgrp{display:inline-flex;align-items:center;gap:6px}
.sharep{padding:8px 10px;max-width:340px}
.sharep p{margin:0 0 10px;font-size:var(--t13);color:var(--muted)}
.sharep select,.sharep input{width:100%;border:1px solid var(--line2);border-radius:6px;padding:7px 8px;min-height:36px;background:var(--panel);margin:4px 0 10px}
.badge{font-family:var(--disp);font-size:var(--t12);font-weight:700;letter-spacing:.03em;border-radius:4px;padding:0 6px;line-height:18px;background:var(--brand-soft);color:var(--brand-ink);white-space:nowrap}
.scbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:7px;padding:5px 10px;background:var(--panel);cursor:pointer;min-height:36px;max-width:340px}
.scbtn .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scbtn .g{font-family:var(--disp);font-weight:700;color:var(--caution);white-space:nowrap} .scbtn .g.ok{color:var(--ok)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink);font-weight:700;border:1px solid var(--line2);cursor:pointer}
/* ---------- menus ---------- */
.menu{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow);min-width:260px;max-width:min(380px,calc(100vw - 24px));max-height:min(70vh,560px);overflow:auto;padding:6px}
.menu .mh{font-size:var(--t12);color:var(--muted);text-transform:uppercase;letter-spacing:.07em;padding:8px 10px 4px;font-weight:600}
.menu .mi{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;background:none;border-radius:6px;padding:8px 10px;min-height:36px;cursor:pointer;font-size:var(--t15)}
.menu .mi:hover:not(:disabled),.menu .mi:focus-visible{background:var(--sunk)}
.menu .mi:disabled{color:var(--faint);cursor:default}
.menu .mi.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.menu .mi .r{margin-left:auto;font-family:var(--disp);font-weight:700;color:var(--caution)} .menu .mi .r.ok{color:var(--ok)}
.menu .mi.danger{color:var(--warn)}
.menu hr{border:none;border-top:1px solid var(--line);margin:6px 0}
.menu input{width:100%;border:1px solid var(--line2);border-radius:6px;padding:7px 9px;background:var(--panel);margin:4px 0}
.menu .confirm{padding:8px 10px;font-size:var(--t13);background:var(--warn-soft);border-radius:6px;margin:4px 0}
/* ---------- layout ---------- */
.wrap{max-width:1760px;margin:0 auto;padding:16px 20px 90px}
.banner{border:1px solid var(--line2);background:var(--panel);border-radius:var(--r);padding:10px 14px;font-size:var(--t15);margin-bottom:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner.caution{border-color:var(--caution);background:var(--caution-soft)}
.banner.info{border-color:var(--info);background:var(--info-soft)}
.banner.err{border-color:var(--warn);background:var(--warn-soft)}
.banner .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
/* summary strip */
.summary{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.tile .k{font-size:var(--t12);color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.tile .v{font-family:var(--disp);font-weight:700;font-size:var(--t32);line-height:1.1;font-variant-numeric:tabular-nums}
.tile .s{font-size:var(--t12);color:var(--muted)}
.tile.gap{border-color:var(--caution);background:var(--caution-soft)} .tile.gap .v,.tile.gap .k{color:var(--caution)}
.tile.fit{border-color:var(--ok);background:var(--ok-soft)} .tile.fit .v,.tile.fit .k{color:var(--ok)}
@media (max-width:1100px){.summary{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.tile .v{font-size:var(--t24)}}
/* chart */
.chartcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 8px;margin-top:10px}
.chhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.chhead h2{margin:0;font-size:var(--t18)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:var(--t13);color:var(--muted);margin-left:auto}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:5px}
.chart{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;height:150px;margin-top:10px;align-items:end;position:relative}
.bar{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;border:none;background:none;padding:0;cursor:pointer;border-radius:4px}
.bar:hover{background:var(--sunk)}
.bar.sel{outline:2px solid var(--ink);outline-offset:-2px}
.bar.sel::after{content:"Selected";position:absolute;bottom:-2px;left:0;right:0;text-align:center;font-size:11px;font-weight:700;color:var(--ink)}
.bar .seg.fin{background:repeating-linear-gradient(135deg,var(--camp) 0 5px,#d9a3a0 5px 9px)}
.pcard .phx{font-weight:400;color:var(--muted);font-size:var(--t13);white-space:nowrap}
.pcard.done{opacity:.7}
.pcard.done .pn{text-decoration:none}
.bar .seg{display:block;width:70%;margin:0 auto}
.bar .seg.lev{background:var(--save);opacity:.85}
.bar .seg.soft{background:var(--boost);opacity:.85}
.bar .seg.camp{background:var(--camp)}
.bar .seg.over{background:repeating-linear-gradient(45deg,var(--warn) 0 4px,transparent 4px 7px);border:1px solid var(--warn)}
.bar .seg:first-child{border-radius:3px 3px 0 0}
.bar .cap{position:absolute;left:8%;right:8%;border-top:2px dashed var(--ink);opacity:.55}
.bar .bl{position:absolute;top:0;left:0;right:0;text-align:center;font-family:var(--disp);font-weight:600;font-size:var(--t12);color:var(--muted)}
.chticks{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;font-family:var(--disp);font-size:var(--t13);color:var(--muted);text-align:center;margin-top:4px}
/* what-if */
.whatif{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-top:10px}
.whatif summary{list-style:none;cursor:pointer;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-height:44px}
.whatif summary::-webkit-details-marker{display:none}
.whatif summary h2{margin:0;font-size:var(--t18)}
.whatif summary .changed{font-size:var(--t13);color:var(--caution);font-weight:600}
.whatif summary::after{content:"▾";margin-left:auto;color:var(--muted)}
.whatif[open] summary::after{content:"▴"}
.levers{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px 22px;padding:4px 14px 14px}
.lever label.lt{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;font-size:var(--t15)}
.lever .lv{font-family:var(--disp);font-weight:700;color:var(--brand-ink);font-variant-numeric:tabular-nums}
.lever input[type=range]{width:100%;accent-color:var(--brand);height:24px;margin:2px 0}
.lever .note{font-size:var(--t12);color:var(--muted);line-height:1.35}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;min-height:32px}
.toggle input{position:absolute;opacity:0;pointer-events:none}
.tk{width:42px;height:24px;border-radius:20px;background:var(--line2);position:relative;flex:none}
.tk::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.toggle input:checked + .tk{background:var(--vppel)}
.toggle input:checked + .tk::after{transform:translateX(18px)}
.toggle input:focus-visible + .tk{outline:2px solid var(--brand-ink);outline-offset:2px}
.toggle input:disabled + .tk{opacity:.5}
/* toolbar above years */
.ybar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 10px}
.ybar h2{margin:0;font-size:var(--t18)}
.seg2{display:inline-flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.seg2 button{border:none;background:var(--panel);padding:5px 12px;min-height:32px;cursor:pointer;font-weight:600;font-size:var(--t13)}
.seg2 button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input,.filters select{border:1px solid var(--line2);border-radius:7px;padding:5px 9px;min-height:32px;background:var(--panel);font-size:var(--t13)}
.filters input{width:170px}
.fnote{font-size:var(--t13);color:var(--muted)}
/* years */
.years{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;align-items:flex-start;scroll-snap-type:x proximity;scrollbar-width:thin}
.year{flex:0 0 232px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);scroll-snap-align:start}
.year.dragover{outline:2px dashed var(--brand-ink);outline-offset:-3px}
.year.cur{border-top:3px solid var(--brand)}
.yhead{padding:10px 11px 9px;border-bottom:1px solid var(--line);position:sticky;top:0}
.yh1{display:flex;align-items:baseline;gap:8px}
.yh1 .fy{font-family:var(--disp);font-weight:700;font-size:var(--t18)}
.yh1 .tag{font-size:var(--t12);color:var(--brand-ink);font-weight:600}
.yh1 .tot{margin-left:auto;font-family:var(--disp);font-weight:700;font-size:var(--t18);font-variant-numeric:tabular-nums}
.ycap{margin-top:6px}
.ycap .cb{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.ycap .cb span{display:block;height:100%;background:var(--ok)}
.ycap.over .cb span{background:var(--warn)}
.ycap .ct{display:flex;justify-content:space-between;font-size:var(--t12);color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums;gap:6px}
.ycap.over .ct b{color:var(--warn)}
.ycap .ext{font-size:var(--t12);color:var(--camp);font-weight:600}
.fundbtn{font-size:var(--t12);margin-top:2px}
.funds{padding:8px 11px;border-bottom:1px solid var(--line);background:var(--sunk);font-size:var(--t12)}
.fm{margin-bottom:6px}.fm:last-child{margin-bottom:0}
.fm .fr{display:flex;justify-content:space-between;gap:6px;font-variant-numeric:tabular-nums}
.fm .fr b{font-weight:600}
.fm .fb{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:2px}
.fm .fb span{display:block;height:100%}
.fm .fx{color:var(--muted)} .fm.over .fx{color:var(--warn);font-weight:600}
.plist{padding:8px;display:flex;flex-direction:column;gap:6px;min-height:60px}
.empty{color:var(--muted);text-align:center;font-size:var(--t13);padding:14px 4px;border:1px dashed var(--line2);border-radius:6px}
.pcard{display:block;width:100%;text-align:left;border:1px solid var(--line);border-left:4px solid var(--save);border-radius:6px;background:var(--panel);padding:7px 9px;cursor:pointer;min-height:44px}
.pcard:hover{background:var(--sunk)}
.pcard[aria-expanded="true"]{outline:2px solid var(--brand-ink);outline-offset:1px}
.pcard .l1{display:flex;gap:8px;align-items:baseline}
.pcard .pn{font-weight:600;font-size:var(--t15);line-height:1.25;flex:1;min-width:0;overflow-wrap:anywhere}
.pcard .pc{font-family:var(--disp);font-weight:700;font-size:var(--t15);font-variant-numeric:tabular-nums;white-space:nowrap}
.pcard .l2{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;align-items:center}
.pcard.dim{opacity:.35}
.pcard[draggable="true"]{cursor:grab}
.tagc{font-family:var(--disp);font-size:var(--t12);font-weight:600;letter-spacing:.03em;border-radius:4px;padding:0 6px;line-height:18px;border:1px solid var(--line2);color:var(--muted);background:var(--panel);white-space:nowrap}
.tagc.src{color:#fff;border-color:transparent}
.tagc.High{color:var(--warn);border-color:var(--warn)} .tagc.Med{color:var(--muted)} .tagc.Low{color:var(--faint);border-style:dashed} .tagc.yr10{color:var(--info);border-color:var(--info)}
.tagc.est{color:var(--caution);border-color:var(--caution)}
.tagc.ph{background:var(--brand-soft);color:var(--brand-ink);border-color:transparent}
.tagc.warn{color:var(--warn);border-color:var(--warn)}
.newproj{border:1px dashed var(--line2);background:none;color:var(--brand-ink);border-radius:6px;padding:8px;font-weight:600;font-size:var(--t13);cursor:pointer;width:100%;min-height:36px}
.newproj:hover{background:var(--brand-soft)}
/* empty district */
.emptyplan{background:var(--panel);border:1px dashed var(--line2);border-radius:var(--r);padding:28px;text-align:center}
.emptyplan h3{margin:0 0 6px;font-size:var(--t24)}
.emptyplan .btnrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
/* table view */
.tblwrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
table.pt{border-collapse:collapse;width:100%;font-size:var(--t13);min-width:760px}
.pt th,.pt td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.pt th{font-size:var(--t12);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;white-space:nowrap}
.pt th button{border:none;background:none;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;padding:4px 0}
.pt td.n{text-align:right;font-family:var(--disp);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pt tbody tr{cursor:pointer}
.pt tbody tr:hover{background:var(--sunk)}
.pt tfoot td{font-weight:700;border-bottom:none}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(15,14,20,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--panel);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.dh{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-size:var(--t18);flex:1}
.db{padding:14px 16px 30px;overflow-y:auto;flex:1}
.df{padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.fld{display:block;margin-bottom:12px}
.fld > span,.fld > label{display:block;font-weight:600;font-size:var(--t13);margin-bottom:4px}

function brandTokens(c){

  let ink=c;for(let i=0;i<20&&contrast(ink,"#FFFFFF")<4.5;i++)ink=mix(ink,"#000000",.12);

let viewId=null,PROJECTS=[],S=null;
function loadInto(sc){PROJECTS=hydrate(sc);S=leversOf(sc?sc.levers:null);}
function packFull(projects){return projects.map(p=>{
  const r={id:p.id,name:p.name,pri:p.pri||"",est:p.est!==false,rec:(p.rec||[]).slice(),area:p.area||"",
    phases:p.phases.map(ph=>{const o={cost:ph.cost,year:ph.year,funding:ph.funding.map(f=>({b:f.b,p:f.p}))};
      if(ph.status)o.status=ph.status;if(ph.actual!=null)o.actual=ph.actual;return o;})};
  if(p.cond)r.cond=p.cond;if(p.life!=null)r.life=p.life;
  if(p.custom)r.custom=true;return r;});}
function workingPlan(){return {levers:{vppel:S.vppel,pg:S.pg,gy:S.gy,sg:S.sg,infl:S.infl,sf:S.sf,fin:cleanFin(S.fin)},projects:packFull(PROJECTS),full:true};}
function sigOf(plan){const L=leversOf(plan.levers);
  return JSON.stringify([L.vppel,L.pg,L.gy,L.sg,L.infl,L.sf,L.fin,packFull(cleanList(plan.projects)).map(p=>[p.id,p.name,p.pri,p.area,p.est,p.cond||"",p.life,
    p.phases.map(ph=>[ph.year,ph.cost,ph.status||"",ph.actual,ph.funding.map(f=>[f.b,f.p])])])]);}
function activeSig(){const sc=scById(viewId);return sigOf(sc?{levers:sc.levers,projects:sc.projects}:{levers:null,projects:DOC.projects});}
function isDirty(){return sigOf(workingPlan())!==activeSig();}

const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}};

/* ================= roles =================
   local  — nobody shares this district (demo, offline, or not in the shared plan): full editing, saves in this browser
   admin / editor — listed in cip_member: full editing, saves for everyone; admins also manage people
   viewer — a shared district you can't write: read, open projects, and move the what-if levers; nothing saves */
/* Only demos (and a deployment with no shared store at all) save to this computer.
   A real district saves to the shared plan or not at all, so there is never a
   second copy to reconcile. */
function ROLE(){
  if(!sbConfigured())return "local";
  if(!SB.checked)return "viewer";
  if(SB.on&&SB.token&&SB.member)return SB.member==="admin"?"admin":"editor";
  if(DOC&&DOC.tenant.demo&&(!SB.on||SB.missing))return "local";
  return "viewer";
}
const offline=()=>sbConfigured()&&SB.checked&&!SB.on&&!(DOC&&DOC.tenant.demo);
const canEditPlan=()=>ROLE()!=="viewer";
/* a locked scenario can be changed on screen; saving it makes a new scenario */
const canEditProjects=()=>canEditPlan()&&!BUSY;
const canSettings=()=>ROLE()!=="viewer";
const isAdmin=()=>ROLE()==="admin"||ROLE()==="local";
const isBoard=id=>!!(DOC&&DOC.boardId&&DOC.boardId===id);

/* ================= save / publish ================= */
let BUSY=false,ERRMSG="",JUSTSAVED=false,FILEDIRTY=false;
const ORIG_ID="orig";
const isOrig=()=>viewId===ORIG_ID;
const isLocked=()=>{const sc=scById(viewId);return !!(sc&&sc.locked);};
const nowIso=()=>new Date().toISOString();
const fmtWhen=iso=>{if(!iso)return "";try{const d=new Date(iso);
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})+" at "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});}catch(e){return "earlier";}};
const fmtDay=iso=>{try{return new Date(iso+(iso.length===10?"T12:00:00":"")).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});}catch(e){return iso;}};
const who=()=>SB.email||"";

/* every save leaves a line in the plan's history: who, when, what, and the gap after */
function logged(mutate,msg,opts){return d=>{mutate(d);if(opts&&opts.log===false)return;
  const sc=(opts&&opts.view&&d.scenarios.find(x=>x.id===opts.view))||d.scenarios.find(x=>x.id===viewId);
  let gap=null;try{gap=Math.round(computeFor(cleanList(sc?sc.projects:d.projects),leversOf(sc?sc.levers:null)).gap);}catch(e){}
  (d.history=d.history||[]).push({at:nowIso(),by:who(),what:String(msg||"Saved").replace(/\.$/,""),sc:sc?sc.name:"",gap:gap});
  if(d.history.length>150)d.history=d.history.slice(-150);};}
async function publishDoc(mutate,nextView,msg,opts){
  if(BUSY)return false;
  if(!canEditPlan()){toast(offline()?"Can't reach the shared plan right now, so nothing can be saved.":"You can't save here — sign in as an editor.");return false;}
  mutate=logged(mutate,msg,Object.assign({view:nextView},opts||{}));
  const keep=opts&&opts.keepWorking?{P:clone(PROJECTS),S:clone(S),v:viewId}:null;
  if(sharedWriter()){const ok=await sbPublish(mutate,nextView,msg);if(ok&&keep)restoreWorking(keep);return ok;}
  mutate(DOC);DOC.savedAt=nowIso();
  const ok=saveLocal();
  afterSave(nextView);FILEDIRTY=true;if(keep)restoreWorking(keep);
  toast(ok?(msg||"Saved on this computer."):"This browser won't store data (private window?), so demo changes last until you close the tab.");
  return true;
}
function restoreWorking(k){if(k.v===viewId){PROJECTS=cleanList(k.P);S=leversOf(k.S);syncLevers();render();}}
function afterSave(nextView){
  applySettings(DOC.settings);
  if(nextView)viewId=nextView;
  if(!scById(viewId))viewId=DOC.scenarios[0]?DOC.scenarios[0].id:null;
  loadInto(scById(viewId));ERRMSG="";closeMenu();
  syncLevers();render();
}
const stamp=()=>({savedAt:nowIso(),savedBy:who()});
function saveActive(){
  const sc=scById(viewId);
  if(sc&&sc.locked){askName("new",sc.name+" — revised");return;}
  if(!sc){askName("new","Scenario "+(DOC.scenarios.length+1));return;}
  publishDoc(d=>{const t=d.scenarios.find(x=>x.id===viewId);Object.assign(t,workingPlan(),stamp());d.activeId=d.activeId||viewId;},null,"Saved “"+sc.name+"”.");
}
function saveAsNew(name){const id=uid();
  publishDoc(d=>{d.scenarios.push(Object.assign({id:id,name:name},workingPlan(),stamp()));if(!d.activeId)d.activeId=id;},id,"Saved as “"+name+"”.");}

function statusInfo(){
  const dirty=isDirty(),r=ROLE();
  if(BUSY)return ["busy","Saving…"];
  if(ERRMSG)return ["err","Not saved — details"];
  if(r==="viewer"){
    if(offline())return [dirty?"dirty":"off",dirty?"Offline · changes can't be saved":"Offline copy · can't save right now"];
    if(dirty)return ["dirty","What-if · not saved"];
    const sc=scById(viewId);const by=sc&&sc.savedBy?` by ${sc.savedBy.split("@")[0]}`:"";
    return ["ok",`Live plan · updated ${fmtDay((SB.stamp||DOC.savedAt||"").slice(0,10))}${by}`];
  }
  if(dirty)return ["dirty",isLocked()?"Unsaved · saves as a new scenario":"Unsaved changes"];
  if(r==="local")return ["off",DOC.tenant.demo?"Demo · changes stay on this computer":"Saved on this computer"];
  const sc=scById(viewId);
  return ["ok",JUSTSAVED?"Saved for everyone ✓":`Live plan · saved ${fmtDay(((sc&&sc.savedAt)||SB.stamp||"").slice(0,10))}`];
}

/* ================= year columns + cards ================= */
const VIEW={mode:"cards",q:"",pri:"",area:"",src:"",est:"",sort:{k:"fy",dir:1},fold:new Set(),funds:new Set(),foldInit:false};
function phaseMatches(p,ph){
  if(VIEW.q&&!p.name.toLowerCase().includes(VIEW.q.toLowerCase()))return false;
  if(VIEW.pri&&p.pri!==VIEW.pri)return false;
  if(VIEW.area&&p.area!==VIEW.area)return false;
  if(VIEW.src&&!ph.funding.some(f=>f.b===VIEW.src))return false;
  if(VIEW.est==="est"&&!p.est)return false;
  if(VIEW.est==="firm"&&p.est)return false;
  return true;
}
const filtering=()=>!!(VIEW.q||VIEW.pri||VIEW.area||VIEW.src||VIEW.est);
function paintFilters(){
  const areas=[...new Set(PROJECTS.map(p=>p.area).filter(Boolean))].sort();
  $("farea").innerHTML=`<option value="">Any focus area</option>`+areas.map(a=>`<option ${a===VIEW.area?"selected":""}>${esc(a)}</option>`).join("");
  $("farea").hidden=!areas.length;
  $("fsrc").innerHTML=`<option value="">Any source</option>`+Object.keys(BUCKETS).map(k=>`<option value="${k}" ${k===VIEW.src?"selected":""}>${BUCKETS[k].name}</option>`).join("");
  $("fpri").value=VIEW.pri;$("fest").value=VIEW.est;if($("fq").value!==VIEW.q)$("fq").value=VIEW.q;
  $("vcards").setAttribute("aria-pressed",VIEW.mode==="cards");$("vtable").setAttribute("aria-pressed",VIEW.mode==="table");
  const total=PROJECTS.reduce((a,p)=>a+p.phases.length,0),shown=PROJECTS.reduce((a,p)=>a+p.phases.filter(ph=>phaseMatches(p,ph)).length,0);
  $("fnote").textContent=filtering()?`Showing ${shown} of ${total} · totals include everything`:"";
  $("filters").hidden=!PROJECTS.length;
}
$("fq").oninput=e=>{VIEW.q=e.target.value;paintYears();paintFilters();};
["fpri","farea","fsrc","fest"].forEach(id=>$(id).onchange=e=>{VIEW[{fpri:"pri",farea:"area",fsrc:"src",fest:"est"}[id]]=e.target.value;paintYears();paintFilters();});
$("vcards").onclick=()=>{VIEW.mode="cards";render();};
$("vtable").onclick=()=>{VIEW.mode="table";render();};
const curFY=fyOfDate(todayIso());
/* estimates inflated by the lever are rounded: to-the-dollar figures on an estimate claim precision nobody has */
const fmtCost=(ph,L)=>{const c=escalated(ph,L);if(c===0&&!(ph.status==="done"&&ph.actual!=null))return "Unpriced";
  if(ph.status==="done"&&ph.actual!=null)return fmtExact(c);return L.infl>0&&ph.year>0?"≈ "+fmtExact(Math.round(c/1000)*1000):fmtExact(c);};
const fmtCostK=(ph,L)=>{const c=escalated(ph,L);return (c===0&&!(ph.status==="done"&&ph.actual!=null))?"Unpriced":fmtK(c);};
/* a project scheduled after the end of its remaining life is running past failure */
function pastLife(p){if(p.life==null)return false;const end=CFG.start+p.life;return p.phases.some(ph=>CFG.start+ph.year>end&&ph.status!=="done");}
function srcChips(ph,p){return ph.funding.map(f=>`<span class="tagc src" style="background:${BUCKETS[f.b].color}">${BUCKETS[f.b].name}${ph.funding.length>1?" "+f.p+"%":""}</span>`+
  (SOFT.includes(f.b)&&!p.rec.includes(f.b)?`<span class="tagc warn" title="Not a usual source for this project — confirm eligibility">check</span>`:"")).join("");}
function cardHtml(p,ph,pi){
  const ed=canEditProjects(),multi=p.phases.length>1,c=escalated(ph,S);
  const pri=p.pri?`<span class="tagc ${p.pri==="10-yr"?"yr10":p.pri}">${esc(p.pri)}</span>`:"";
  const lab=`${p.name}${multi?`, phase ${p.phases.indexOf(ph)+1} of ${p.phases.length}`:""}, ${YEARS[ph.year].fy}, ${fmtExact(c)}, funded by ${ph.funding.map(f=>BUCKETS[f.b].name+" "+f.p+"%").join(", ")}${p.est?", estimate":""}`;
  const done=ph.status==="done",under=ph.status==="underway",late=pastLife(p);
  return `<button class="pcard ${phaseMatches(p,ph)?"":"dim"} ${done?"done":""}" data-pid="${p.id}" data-pi="${pi}" ${ed?'draggable="true"':""} aria-expanded="${DRAWER.open&&String(DRAWER.pid)===String(p.id)}"
    style="border-left-color:${BUCKETS[ph.funding[0].b].color}" aria-label="${esc(lab)}${done?", complete":""}${late?", scheduled after end of life":""}" ${phaseMatches(p,ph)?"":"hidden"}>
    <span class="l1"><span class="pn">${done?"✓ ":""}${esc(p.name)}${multi?` <span class="phx">${p.phases.indexOf(ph)+1}/${p.phases.length}</span>`:""}</span><span class="pc">${fmtCostK(ph,S)}</span></span>
    <span class="l2">${pri}${srcChips(ph,p)}${under?'<span class="tagc">Underway</span>':""}${late?'<span class="tagc warn">Past end of life</span>':""}</span></button>`;
}
function yearHead(C,y,ytot){
  const m=C.res[y];let av=0,sp=0,over=0,overB=[];
  CAP_ORDER.forEach(b=>{if(b==="vppel"&&!(vppelOn()&&S.vppel)&&!CFG.open.vppel)return;av+=Math.max(0,m.avail[b]);sp+=m.spend[b];if(m.over[b]>0){over+=m.over[b];overB.push(BUCKETS[b].name);}});
  const pct=av>0?Math.min(100,sp/av*100):(sp>0?100:0);
  const fy=CFG.start+y,cur=fy===curFY;
  const open=VIEW.funds.has(y);
  return `<div class="yhead" data-yh="${y}"><div class="yh1"><span class="fy">${YEARS[y].fy}</span>${cur?'<span class="tag">This year</span>':""}<span class="tot">${fmtK(ytot)}</span></div>
    <div class="ycap ${over>0?"over":""}"><div class="cb" role="img" aria-label="${YEARS[y].fy}: ${fmtExact(sp)} of ${fmtExact(av)} levy and grant capacity used${over>0?", over by "+fmtExact(over):""}"><span style="width:${pct}%"></span></div>
      <div class="ct">${over>0?`<b>Over by ${fmtK(over)} · ${overB.join(", ")}</b>`:`<span>${fmtK(sp)} of ${fmtK(av)} capacity</span><span>banks ${fmtK(Math.max(0,av-sp))}</span>`}</div>
      ${m.ext.camp?`<div class="ext">Campaign / bond ${fmtK(m.ext.camp)}${m.fin&&m.fin.used>0?` · ${m.fin.unfunded>0?fmtK(m.fin.used)+" financed":"financed"}`:""}</div>`:""}${m.ext.boost?`<div class="ct"><span>Boosters ${fmtK(m.ext.boost)}</span></div>`:""}
      <button class="linkbtn fundbtn" data-funds="${y}" aria-expanded="${open}">${open?"Hide":"Show"} fund detail</button></div></div>
    ${open?`<div class="funds">${CAP_ORDER.filter(b=>!(b==="vppel"&&!(vppelOn()&&S.vppel)&&!CFG.open.vppel)).map(b=>{const a=m.avail[b],s=m.spend[b],o=m.over[b],inf=inflow(b,y,S);
      return `<div class="fm ${o>0?"over":""}"><div class="fr"><b style="color:${BUCKETS[b].color}">${BUCKETS[b].name}</b><span>${fmtK(s)} / ${fmtK(a)}</span></div>
        <div class="fb"><span style="width:${a>0?Math.min(100,s/a*100):(s>0?100:0)}%;background:${o>0?"var(--warn)":BUCKETS[b].color}"></span></div>
        <div class="fx" title="carry-in ${fmtExact(m.carryIn[b])} + ${fmtExact(inf)} this year = ${fmtExact(a)}">${o>0?`Over by ${fmtK(o)}`:`carry-in ${fmtK(m.carryIn[b])} + ${fmtK(inf)} → banks ${fmtK(a-s)}`}</div></div>`;}).join("")}
      ${y===0&&CFG.f0<1?`<div class="fx">Receipts prorated to the ${CFG.months0} months after the ${esc(fmtDay(SET.balances.asOf))} balance.</div>`:""}</div>`:""}`;
}
function paintYears(){
  const C=LASTC,box=$("yearsbox");
  if(!PROJECTS.length&&!DOC.projects.length){
    box.innerHTML=`<div class="emptyplan"><h3>No projects yet</h3><p class="muted">Add the district's capital projects to see how they fit.</p>
      <div class="btnrow">${canEditPlan()?`<button class="btn primary" id="ep-up">Upload a spreadsheet</button><button class="btn" id="ep-one">Add one project</button><button class="btn" id="ep-sample">Copy a sample list</button>`:`<span class="muted">An editor hasn't added projects yet.</span>`}</div></div>`;
    const on=(id,fn)=>{const b=$(id);if(b)b.onclick=fn;};
    on("ep-up",()=>openSettings("projects"));on("ep-one",()=>newProject(0));
    on("ep-sample",()=>{let id=1;PROJECTS=clone(SEED["demo-small"].projects).map(p=>cleanProject(Object.assign(p,{id:id++})));render();toast("Sample projects added. Save to keep them.");});
    return;
  }
  if(VIEW.mode==="table"){box.innerHTML=tableHtml();wireTable();return;}
  if(!VIEW.foldInit&&window.innerWidth<=700){VIEW.foldInit=true;for(let y=1;y<N;y++)VIEW.fold.add(y);}
  const ed=canEditProjects();
  let h=`<div class="years" id="years">`;
  for(let y=0;y<N;y++){
    const items=[];PROJECTS.forEach(p=>p.phases.forEach((ph,i)=>{if(ph.year===y)items.push({p,ph,i});}));
    const ytot=items.reduce((a,it)=>a+escalated(it.ph,S),0);
    h+=`<section class="year ${CFG.start+y===curFY?"cur":""} ${VIEW.fold.has(y)?"fold":""}" data-year="${y}" aria-label="${YEARS[y].fy}">${yearHead(C,y,ytot)}<div class="plist">`;
    if(!items.length)h+=`<div class="empty">${ed?"Nothing planned · drop a project here":"Nothing planned this year"}</div>`;
    items.forEach(it=>h+=cardHtml(it.p,it.ph,it.i));
    if(ed)h+=`<button class="newproj" data-new="${y}">+ Add project in ${YEARS[y].fy}</button>`;
    h+=`</div></section>`;
  }
  box.innerHTML=h+`</div>`;
  wireYears();markInView();
}
function wireYears(){
  const box=$("yearsbox"),q=(s,f)=>box.querySelectorAll(s).forEach(f);
  q(".pcard",b=>{b.onclick=()=>openDrawer(b.dataset.pid,false,+b.dataset.pi);
    b.ondragstart=e=>{e.dataTransfer.setData("text/plain",b.dataset.pid+":"+b.dataset.pi);e.dataTransfer.effectAllowed="move";};});
  q("[data-new]",b=>b.onclick=()=>newProject(+b.dataset.new));
  q("[data-funds]",b=>b.onclick=e=>{e.stopPropagation();const y=+b.dataset.funds;VIEW.funds.has(y)?VIEW.funds.delete(y):VIEW.funds.add(y);paintYears();});
  q("[data-yh]",h=>h.onclick=e=>{if(window.innerWidth>700||e.target.closest("button"))return;const y=+h.dataset.yh;VIEW.fold.has(y)?VIEW.fold.delete(y):VIEW.fold.add(y);paintYears();});
  q(".year",col=>{col.ondragover=e=>{if(!canEditProjects())return;e.preventDefault();col.classList.add("dragover");};
    col.ondragleave=()=>col.classList.remove("dragover");
    col.ondrop=e=>{e.preventDefault();col.classList.remove("dragover");if(!canEditProjects())return;
      const [pid,pi]=(e.dataTransfer.getData("text/plain")||"").split(":");const p=findP(pid);if(!p||!p.phases[+pi])return;
      p.phases[+pi].year=+col.dataset.year;p.phases.sort((a,b)=>a.year-b.year);render();announce(`${p.name} moved to ${YEARS[+col.dataset.year].fy}.`);};});
  const yb=$("years");if(yb)yb.onscroll=()=>markInView();
}
function goYear(y){
  if(VIEW.mode==="table"){VIEW.q="";render();}
  VIEW.fold.delete(y);paintYears();
  const col=document.querySelector(`.year[data-year="${y}"]`);if(!col)return;
  if(window.innerWidth<=700){col.scrollIntoView({behavior:"smooth",block:"start"});}
  else{const yb=$("years");yb.scrollTo({left:col.offsetLeft-yb.offsetLeft-4,behavior:"smooth"});
    $("yearsbox").scrollIntoView({behavior:"smooth",block:"nearest"});}

const findP=id=>PROJECTS.find(x=>String(x.id)===String(id));
const nextId=list=>Math.max(1000,...list.map(p=>Number(p.id)||0))+1;
function newProject(y){
  if(!canEditProjects()){toast("Sign in as an editor to add projects.");return;}
  const id=nextId(PROJECTS);
  PROJECTS.push({id:id,name:"New project",pri:"",est:true,custom:true,rec:[],area:"",cond:"",life:null,phases:[{cost:0,year:y,funding:[{b:"save",p:100}]}]});

/* ================= table view ================= */
function tableRows(){
  const rows=[];PROJECTS.forEach(p=>p.phases.forEach((ph,i)=>{if(phaseMatches(p,ph))rows.push({p,ph,i,c:escalated(ph,S)});}));
  const k=VIEW.sort.k,d=VIEW.sort.dir;
  const key={status:r=>({done:2,underway:1}[r.ph.status]||0),name:r=>r.p.name.toLowerCase(),fy:r=>r.ph.year*1e9+(1e8-r.c),cost:r=>r.c,src:r=>r.ph.funding[0].b,pri:r=>({High:0,Med:1,Low:2,"10-yr":3}[r.p.pri]??4),area:r=>r.p.area||"~",est:r=>r.p.est?1:0}[k];
  rows.sort((a,b)=>{const x=key(a),y=key(b);return (x<y?-1:x>y?1:0)*d;});
  return rows;
}
function tableHtml(){
  const rows=tableRows(),tot=rows.reduce((a,r)=>a+r.c,0);
  const done=rows.filter(r=>r.ph.status==="done"&&r.ph.actual!=null),dv=done.reduce((a,r)=>a+(r.ph.actual-r.ph.cost),0);
  const th=(k,l,n)=>`<th ${n?'style="text-align:right"':""} aria-sort="${VIEW.sort.k===k?(VIEW.sort.dir>0?"ascending":"descending"):"none"}"><button data-sort="${k}">${l}${VIEW.sort.k===k?(VIEW.sort.dir>0?" ▲":" ▼"):""}</button></th>`;
  return `<div class="tblwrap"><table class="pt"><thead><tr>${th("name","Project")}${th("fy","FY")}${th("cost","Cost",1)}${th("src","Funding")}${th("pri","Priority")}${th("area","Focus area")}${th("est","Confidence")}${th("status","Status")}</tr></thead><tbody>
    ${rows.map(r=>`<tr data-pid="${r.p.id}" data-pi="${r.i}" tabindex="0"><td><b>${esc(r.p.name)}</b>${r.p.phases.length>1?` <span class="tagc ph">Phase ${r.i+1}/${r.p.phases.length}</span>`:""}</td><td>${YEARS[r.ph.year].fy}</td>
      <td class="n">${fmtCost(r.ph,S)}</td><td>${srcChips(r.ph,r.p)}</td><td>${esc(r.p.pri||"—")}</td><td>${esc(r.p.area||"—")}</td><td>${r.p.est?"Estimate":"Firm"}</td>
      <td>${r.ph.status==="done"?"✓ Complete":r.ph.status==="underway"?"Underway":"Planned"}${pastLife(r.p)?' <span class="tagc warn">Past end of life</span>':""}</td></tr>`).join("")}
    </tbody><tfoot><tr><td colspan="2">${rows.length} row${rows.length===1?"":"s"}${filtering()?" (filtered)":""}</td><td class="n">${S.infl>0?"≈ "+fmtExact(Math.round(tot/1000)*1000):fmtExact(tot)}</td><td colspan="5" class="muted" style="font-weight:400">${S.infl>0?`Future-year estimates at ${(S.infl*100).toFixed(1)}%/yr inflation, rounded to $1,000.`:""}${done.length?` Completed with actual costs: ${done.length}, ${dv>=0?"+":"−"}${fmtExact(Math.abs(dv)).replace("-","")} vs estimate.`:""}</td></tr></tfoot></table></div>
    ${canEditProjects()?`<div style="margin-top:8px"><button class="btn sm" id="tbl-new">+ Add project</button></div>`:""}`;
}
function wireTable(){
  const box=$("yearsbox");
  box.querySelectorAll("[data-sort]").forEach(b=>b.onclick=()=>{const k=b.dataset.sort;VIEW.sort=VIEW.sort.k===k?{k:k,dir:-VIEW.sort.dir}:{k:k,dir:1};paintYears();box.querySelector(`[data-sort="${k}"]`).focus();});

function wireDrawer(p){
  const box=$("drawerbox"),q=(s,f)=>box.querySelectorAll(s).forEach(f);
  const upd=(msg)=>{render();paintDrawer();if(msg)announce(msg);};
  $("d-close").onclick=closeDrawer;$("d-scrim").onclick=closeDrawer;
  const nm=$("d-name");nm.onchange=()=>{const v=nm.value.replace(/\s+/g," ").trim().slice(0,90);if(v)p.name=v;upd();};
  nm.onkeydown=e=>{if(e.key==="Enter")nm.blur();};
  $("d-pri").onchange=e=>{p.pri=e.target.value;upd();};
  $("d-est").onchange=e=>{p.est=e.target.value==="1";upd();};
  $("d-area").onchange=e=>{p.area=e.target.value.trim().slice(0,40);upd();};
  q(".d-year",s=>s.onchange=()=>{const ph=p.phases[+s.dataset.pi];ph.year=+s.value;p.phases.sort((a,b)=>a.year-b.year);upd(`Moved to ${YEARS[ph.year].fy}.`);});
  q(".d-cost",i=>{i.onchange=()=>{const n=parseInt(i.value.replace(/[^0-9]/g,""),10);p.phases[+i.dataset.pi].cost=isNaN(n)?0:n;upd();};i.onkeydown=e=>{if(e.key==="Enter")i.blur();};});
  q(".d-src",s=>s.onchange=()=>{p.phases[+s.dataset.pi].funding[+s.dataset.si].b=s.value;upd();});
  q(".d-pct",i=>{i.onchange=()=>{setPct(p.phases[+i.dataset.pi],+i.dataset.si,parseInt(i.value.replace(/[^0-9]/g,""),10)||0);upd();};i.onkeydown=e=>{if(e.key==="Enter")i.blur();};});
  q("[data-rmsplit]",b=>b.onclick=()=>{const [pi,si]=b.dataset.rmsplit.split(":").map(Number);removeSplit(p.phases[pi],si);upd();});
  q("[data-addsplit]",b=>b.onclick=()=>{const ph=p.phases[+b.dataset.addsplit];addSplit(p,ph);upd();});
  q("[data-addph]",b=>b.onclick=()=>{addPhase(p,+b.dataset.addph);upd("Split into another year.");});
  q("[data-rmph]",b=>b.onclick=()=>{removePhase(p,+b.dataset.rmph);upd("Phase removed; its cost moved to the phase before.");});
  q("[data-mv]",b=>b.onclick=()=>{const ph=p.phases[+b.dataset.pi];ph.year=Math.max(0,Math.min(N-1,ph.year+ +b.dataset.mv));p.phases.sort((a,b2)=>a.year-b2.year);upd(`Moved to ${YEARS[ph.year].fy}.`);});
  const del=$("d-del");if(del)del.onclick=()=>{DRAWER.confirmDel=true;paintDrawer();$("d-delno").focus();};
  const undoable=(msg)=>{const before=clone(PROJECTS);return ()=>{DRAWER.open=false;DRAWER.fresh=null;$("drawerbox").innerHTML="";render();announce(msg);
    toast(msg,["Undo",()=>{PROJECTS=cleanList(before);render();toast("Restored.");}]);};};
  const dy=$("d-delyes");if(dy){const done=undoable(`Deleted “${p.name}”${p.phases.length>1?" — all "+p.phases.length+" phases":""}.`);
    dy.onclick=()=>{PROJECTS=PROJECTS.filter(x=>x!==p);done();};
    $("d-delno").onclick=()=>{DRAWER.confirmDel=false;paintDrawer();};}
  const d1=$("d-delone");if(d1){const done=undoable(`Deleted one phase of “${p.name}”.`);
    d1.onclick=()=>{const pi=Math.max(0,+(DRAWER.phase||0));p.phases.splice(Math.min(pi,p.phases.length-1),1);done();};}
  q(".d-status",s2=>s2.onchange=()=>{const ph=p.phases[+s2.dataset.pi];ph.status=s2.value||undefined;if(ph.status!=="done")delete ph.actual;upd();});
  q(".d-actual",i=>{i.onchange=()=>{const n=parseInt(i.value.replace(/[^0-9]/g,""),10);const ph=p.phases[+i.dataset.pi];if(isNaN(n))delete ph.actual;else ph.actual=n;upd();};i.onkeydown=e=>{if(e.key==="Enter")i.blur();};});
  const dc=$("d-cond");if(dc)dc.onchange=()=>{p.cond=dc.value;upd();};
  const dl=$("d-life");if(dl)dl.onchange=()=>{const n=parseInt(dl.value,10);p.life=isNaN(n)?null:Math.max(0,n);upd();};
  const nt=$("d-note");if(nt)nt.oninput=()=>{DRAWER.note=nt.value;};
  const na=$("d-noteadd");if(na)na.onclick=()=>{const t=(DRAWER.note||"").trim();if(!t)return;const id=p.id,entry={text:t.slice(0,600),by:who(),at:nowIso()};
    DRAWER.note="";publishDoc(d=>{d.notes=d.notes||{};(d.notes[id]=d.notes[id]||[]).push(entry);},null,"Note added.",{keepWorking:true,log:false});};
  /* keep focus inside the drawer */
  box.querySelector(".drawer").addEventListener("keydown",e=>{if(e.key!=="Tab")return;
    const f=[...box.querySelectorAll("button:not(:disabled),input:not(:disabled),select:not(:disabled)")];if(!f.length)return;
    if(e.shiftKey&&document.activeElement===f[0]){f[f.length-1].focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===f[f.length-1]){f[0].focus();e.preventDefault();}});
}

/* ================= uploads: CSV, XLSX (no library) ================= */
function parseCSV(text){
  const rows=[];let row=[],cell="",q=false;
  text=text.replace(/^﻿/,"");
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=c;continue;}
    if(c==='"')q=true;
    else if(c===","||c==="\t"){row.push(cell);cell="";}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(cell);rows.push(row);row=[];cell="";}
    else cell+=c;}
  if(cell!==""||row.length){row.push(cell);rows.push(row);}
  return rows.filter(r=>r.some(x=>String(x).trim()!==""));
}
async function inflateRaw(bytes){
  const ds=new DecompressionStream("deflate-raw");const w=ds.writable.getWriter();w.write(bytes);w.close();
  return new Uint8Array(await new Response(ds.readable).arrayBuffer());
}
async function unzip(buf){
  const u8=new Uint8Array(buf),dv=new DataView(buf),files={};
  let e=-1;for(let i=u8.length-22;i>=Math.max(0,u8.length-66000);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break;}}
  if(e<0)throw new Error("not a zip/xlsx file");
  let p=dv.getUint32(e+16,true);const count=dv.getUint16(e+10,true);
  for(let k=0;k<count;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true);
    const nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lho=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.subarray(p+46,p+46+nl));
    files[name]={method,csize,lho};p+=46+nl+xl+cl;}
  return async name=>{const f=files[name];if(!f)return null;
    const nl=dv.getUint16(f.lho+26,true),xl=dv.getUint16(f.lho+28,true),start=f.lho+30+nl+xl;
    const raw=u8.subarray(start,start+f.csize);
    const out=f.method===0?raw:await inflateRaw(raw);
    return new TextDecoder().decode(out);};
}
async function readXlsx(buf){
  const get=await unzip(buf);
  const xml=s=>new DOMParser().parseFromString(s,"application/xml");
  const ss=[];const sst=await get("xl/sharedStrings.xml");
  if(sst)xml(sst).querySelectorAll("si").forEach(si=>{let t="";si.querySelectorAll("t").forEach(x=>t+=x.textContent);ss.push(t);});
  let sheetPath="xl/worksheets/sheet1.xml";
  const wb=await get("xl/workbook.xml"),rels=await get("xl/_rels/workbook.xml.rels");
  if(wb&&rels){const first=xml(wb).querySelector("sheet");
    const rid=first&&(first.getAttribute("r:id")||first.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id"));
    const rel=rid&&[...xml(rels).querySelectorAll("Relationship")].find(r=>r.getAttribute("Id")===rid);
    if(rel){const t=rel.getAttribute("Target");sheetPath=t.startsWith("/")?t.slice(1):"xl/"+t.replace(/^\.\//,"");}}
  const sh=await get(sheetPath);if(!sh)throw new Error("couldn't find the first worksheet");
  const colIdx=r=>{const m=/^([A-Z]+)/.exec(r||"");let n=0;if(m)for(const ch of m[1])n=n*26+ch.charCodeAt(0)-64;return n-1;};
  const rows=[];
  xml(sh).querySelectorAll("sheetData > row").forEach(r=>{const row=[];
    r.querySelectorAll("c").forEach(c=>{const t=c.getAttribute("t"),v=c.querySelector("v"),is=c.querySelector("is");
      let val=v?v.textContent:"";
      if(t==="s")val=ss[+val]||"";else if(t==="inlineStr"&&is)val=is.textContent;else if(t==="b")val=val==="1"?"TRUE":"FALSE";
      row[colIdx(c.getAttribute("r"))]=val;});
    for(let i=0;i<row.length;i++)if(row[i]===undefined)row[i]="";
    if(row.some(x=>String(x).trim()!==""))rows.push(row);});
  return rows;
}
async function readTable(file){
  if(/\.xlsx$/i.test(file.name))return readXlsx(await file.arrayBuffer());
  if(/\.xls$/i.test(file.name))throw new Error("old .xls format — save it as .xlsx or .csv first");
  return parseCSV(await file.text());
}

/* ---------- value parsers ---------- */
function parseMoney(s){
  s=String(s==null?"":s).trim();if(!s)return null;
  const one=t=>{t=t.replace(/[$,\s]/g,"").toLowerCase();const m=/^(-?\d*\.?\d+)([km]?)$/.exec(t);if(!m)return null;
    return Math.round(parseFloat(m[1])*(m[2]==="k"?1e3:m[2]==="m"?1e6:1));};
  const rg=s.split(/\s*(?:–|—|-(?=\s*\$?\d)|\bto\b)\s*/i).filter(Boolean);
  if(rg.length===2){const a=one(rg[0]),b=one(rg[1]);if(a!=null&&b!=null)return {v:Math.round((a+b)/2),range:true};}
  const v=one(s);return v==null?null:{v:v,range:false};
}
function excelDate(n){const d=new Date(Date.UTC(1899,11,30)+n*86400000);return d.toISOString().slice(0,10);}
function parseFY(s){
  s=String(s==null?"":s).trim();if(!s)return null;
  let m;
  if(/^\d{5}(\.\d+)?$/.test(s))return fyOfDate(excelDate(+s));            /* an Excel date cell */
  if((m=/summer\s*'?(\d{2,4})/i.exec(s)))return yr4(m[1])+1;                /* "Summer 2027" work lands in FY2028 */
  if((m=/fy\s*'?(\d{2,4})/i.exec(s)))return yr4(m[1]);
  if((m=/^(\d{4})\s*[-–\/]\s*(\d{2,4})$/.exec(s)))return m[2].length===2?Math.floor(+m[1]/100)*100+ +m[2]:+m[2];
  if((m=/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/.exec(s)))return fyOfDate(yr4(m[3])+"-"+m[1].padStart(2,"0")+"-"+m[2].padStart(2,"0"));
  if((m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s)))return fyOfDate(s);
  if((m=/^(\d{4})$/.exec(s)))return +m[1];
  if((m=/^(\d{2})$/.exec(s)))return 2000+ +m[1];
  return null;
}
const yr4=t=>t.length===2?2000+ +t:+t;
function parseDate(s){
  s=String(s==null?"":s).trim();let m;
  if(/^\d{5}(\.\d+)?$/.test(s))return excelDate(+s);
  if((m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s)))return m[0];
  if((m=/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/.exec(s)))return yr4(m[3])+"-"+m[1].padStart(2,"0")+"-"+m[2].padStart(2,"0");
  return null;
}
function srcKey(s){
  s=String(s||"").toLowerCase().trim();if(!s)return null;
  if(/v-?\s?ppel|voter|voted/.test(s))return "vppel";
  if(/ppel|physical plant/.test(s))return "ppel";
  if(/save|sales tax|secure an advanced/.test(s))return "save";
  if(/grant|donat|foundation|gift/.test(s))return "grants";
  if(/booster/.test(s))return "boost";
  if(/campaign|bond|referend|\bgo\b|general obligation|fundrais/.test(s))return "camp";
  return undefined;
}
function priKey(s){s=String(s||"").toLowerCase().trim();if(!s)return "";
  if(/10/.test(s))return "10-yr";
  if(/^h|^1$/.test(s))return "High";if(/^m|^2$/.test(s))return "Med";if(/^l|^3$/.test(s))return "Low";return "";}
function findCols(head){
  const H=head.map(h=>String(h||"").toLowerCase().trim());
  const taken=new Set();
  const pick=re=>{const i=H.findIndex((h,k)=>!taken.has(k)&&re.test(h));if(i>=0)taken.add(i);return i;};
  const c={};
  c.conf=pick(/confiden|firm/);
  c.actual=pick(/actual/);
  c.life=pick(/remaining|useful life|life/);
  c.status=pick(/^status|progress/);
  c.cond=pick(/condition/);
  c.name=pick(/^(project|name|item|description|project name)/);
  c.fy=pick(/^fy|fiscal|year|complet|when|timing/);
  c.cost=pick(/estimate|cost|amount|budget|\$/);
  c.pri=pick(/priorit/);
  c.area=pick(/focus|categor|area|goal/);
  c.src=[];c.pct=[];
  H.forEach((h,k)=>{if(taken.has(k))return;if(/%|percent|pct|share/.test(h)){c.pct.push(k);taken.add(k);}});
  H.forEach((h,k)=>{if(taken.has(k))return;if(/source|funding|fund\b|lever/.test(h)){c.src.push(k);taken.add(k);}});
  return c;
}
/* rows → projects. Rows sharing a project name become phases of one project. */
function parseProjects(rows,startFY,years){
  const issues=[],out=[],byName={};
  if(!rows.length)return {projects:[],issues:[{l:"e",m:"The file is empty."}]};
  let hi=rows.findIndex(r=>r.some(x=>/project|name/i.test(String(x))));if(hi<0)hi=0;
  const c=findCols(rows[hi]);
  if(c.name<0)issues.push({l:"e",m:"No “Project” column found. Use the template's headings."});
  if(c.fy<0)issues.push({l:"e",m:"No “FY” column found."});
  if(c.cost<0)issues.push({l:"e",m:"No “Estimate” column found."});
  if(issues.length)return {projects:[],issues};
  let id=1;
  for(let r=hi+1;r<rows.length;r++){
    const row=rows[r],line=r+1,cell=i=>i>=0?String(row[i]==null?"":row[i]).trim():"";
    const name=cell(c.name);if(!name)continue;
    const fy=parseFY(cell(c.fy));
    if(fy==null){issues.push({l:"e",m:`Row ${line} “${name}”: can't read the FY “${cell(c.fy)}”. Use FY2028, 2028 or 2027-28.`});continue;}
    const y=fy-startFY;
    if(y<0||y>=years){issues.push({l:"e",m:`Row ${line} “${name}”: FY${fy} is outside this plan (FY${startFY}–FY${startFY+years-1}). Change the horizon in Balances & plan, or fix the year.`});continue;}
    const mon=parseMoney(cell(c.cost));
    if(!mon){issues.push({l:"e",m:`Row ${line} “${name}”: can't read the estimate “${cell(c.cost)}”.`});continue;}
    if(mon.range)issues.push({l:"w",m:`Row ${line} “${name}”: a range — used the midpoint, ${fmtExact(mon.v)}, and tagged it est.`});
    const funding=[];
    c.src.forEach((si,k)=>{const raw=cell(si);if(!raw)return;const b=srcKey(raw);
      if(b===undefined){issues.push({l:"w",m:`Row ${line} “${name}”: funding source “${raw}” not recognised — used SAVE. Recognised: SAVE, PPEL, V-PPEL, Grants/Donations, Boosters, Campaign/Bond.`});}
      const pRaw=c.pct[k]!=null?cell(c.pct[k]).replace(/%/g,""):"";let p=pRaw===""?null:parseFloat(pRaw);
      funding.push({b:b||"save",p:p});});
    if(!funding.length){funding.push({b:"save",p:100});issues.push({l:"w",m:`Row ${line} “${name}”: no funding source — used SAVE.`});}
    let given=funding.filter(f=>f.p!=null),sumGiven=given.reduce((a,f)=>a+f.p,0);
    /* Excel %-formatted cells arrive as fractions: 1 = 100%, 0.6 = 60% */
    if(sumGiven>0&&sumGiven<=1.0001){given.forEach(f=>f.p*=100);sumGiven*=100;}
    const blank=funding.filter(f=>f.p==null);
    if(blank.length){const each=Math.max(0,(100-sumGiven))/blank.length;blank.forEach(f=>f.p=each);}
    const tot=funding.reduce((a,f)=>a+f.p,0);
    if(Math.abs(tot-100)>0.5&&tot>0){issues.push({l:"w",m:`Row ${line} “${name}”: funding adds to ${Math.round(tot)}% — scaled to 100%.`});funding.forEach(f=>f.p=f.p/tot*100);}
    funding.forEach(f=>f.p=Math.round(f.p));const drift=100-funding.reduce((a,f)=>a+f.p,0);funding[0].p+=drift;
    const conf=cell(c.conf).toLowerCase();
    const key=name.toLowerCase().replace(/\s+/g," ");
    let p=byName[key];
    if(!p){p={id:id++,life:null,cond:"",name:name.slice(0,90),pri:priKey(cell(c.pri)),est:!/^f|firm|bid|contract|actual/.test(conf)||mon.range,
      rec:[],area:cell(c.area).slice(0,40),phases:[]};byName[key]=p;out.push(p);}
    else if(mon.range)p.est=true;
    const stRaw=cell(c.status).toLowerCase(),st=/complete|done|finished|closed/.test(stRaw)?"done":/underway|progress|started|active/.test(stRaw)?"underway":"";
    const act=parseMoney(cell(c.actual));
    const phase={cost:mon.v,year:y,funding:funding.slice(0,3)};if(st)phase.status=st;if(st==="done"&&act)phase.actual=act.v;
    p.phases.push(phase);
    const cond=cell(c.cond);if(cond&&!p.cond){const k=["Good","Fair","Poor","Critical"].find(x=>x.toLowerCase()===cond.toLowerCase());if(k)p.cond=k;}
    const life=parseInt(cell(c.life),10);if(!isNaN(life)&&p.life==null)p.life=life;
    funding.forEach(f=>{if(!p.rec.includes(f.b))p.rec.push(f.b);});
  }
  out.forEach(p=>{p.phases.sort((a,b)=>a.year-b.year);if(p.phases.length>MAX_PH){issues.push({l:"w",m:`“${p.name}” has ${p.phases.length} rows; kept the first ${MAX_PH} phases.`});p.phases=p.phases.slice(0,MAX_PH);}});
  if(!out.length&&!issues.some(i=>i.l==="e"))issues.push({l:"e",m:"No project rows found under the headings."});
  return {projects:out,issues};
}
function parseBalances(rows){
  const found={},issues=[];let asOf=null;
  if(!rows.length)return {found,issues:[{l:"e",m:"The file is empty."}],asOf};
  let hi=rows.findIndex(r=>r.some(x=>/fund|balance/i.test(String(x))));if(hi<0)hi=0;
  const H=rows[hi].map(h=>String(h||"").toLowerCase());
  const ci=re=>H.findIndex(h=>re.test(h));
  const cName=ci(/fund|name|account|description/),cCode=ci(/code|number|no\.?$/),cBal=ci(/balance|amount|ending|\$/),cDate=ci(/as.?of|date|period/);
  if(cBal<0)return {found,issues:[{l:"e",m:"No “Balance” column found. Use the template's headings."}],asOf};
  for(let r=hi+1;r<rows.length;r++){
    const row=rows[r],cell=i=>i>=0?String(row[i]==null?"":row[i]).trim():"";
    const nm=cell(cName),code=cell(cCode).replace(/\D/g,"");
    let b=srcKey(nm);
    if(!b&&/capital projects/i.test(nm)){b="save";issues.push({l:"w",m:`Row ${r+1} “${nm}”: read as SAVE. If it also holds bond proceeds, enter the SAVE part only.`});}
    if(!b&&code==="33")b="save";if(!b&&code==="36")b="ppel";
    if(b==="boost"||b==="camp")b=undefined;
    if(!b){if(nm||code)issues.push({l:"w",m:`Row ${r+1} “${nm||code}”: not a fund this model uses — skipped.`});continue;}
    const m=parseMoney(cell(cBal));
    if(!m){if(cell(cBal))issues.push({l:"e",m:`Row ${r+1} “${nm}”: can't read the balance “${cell(cBal)}”.`});continue;}
    found[b]=(found[b]||0)+m.v;
    if(!asOf&&cDate>=0)asOf=parseDate(cell(cDate));
  }
  if(!Object.keys(found).length)issues.push({l:"e",m:"No SAVE, PPEL, V-PPEL or grant balances found."});
  return {found,issues,asOf};
}

async function logoToDataUrl(file){
  if(file.size>5e6)throw new Error("that image is over 5 MB");
  if(/svg/i.test(file.type)){if(file.size>150000)throw new Error("SVG over 150 kB");
    return "data:image/svg+xml;base64,"+btoa(unescape(encodeURIComponent(await file.text())));}
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("not an image this browser can read"));i.src=url;});
    const k=Math.min(1,256/Math.max(img.width,img.height)),c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c.toDataURL("image/png");}
  finally{URL.revokeObjectURL(url);}
}

function validate(w,all){
  const m=[];
  const tab=ADMIN.tab;
  const need=t=>all||tab===t;
  if(need("district")&&!String(w.district.name||"").trim())m.push("district name");
  if(need("balances")){if(!w.balances.asOf)m.push("balance date");
    if(w.balances.save==null||isNaN(w.balances.save))m.push("SAVE balance");
    if(w.balances.ppel==null||isNaN(w.balances.ppel))m.push("PPEL balance");}
  if(need("revenue")){if(w.save.receipts==null||isNaN(w.save.receipts))m.push("SAVE receipts");
    if(w.ppel.receipts==null||isNaN(w.ppel.receipts))m.push("PPEL receipts");
    if(w.vppel.status!=="none"){if(!num(w.vppel.annual,0))m.push("V-PPEL annual receipts");
      if(!w.vppel.firstFY||!w.vppel.lastFY)m.push("V-PPEL collection years");
      else if(w.vppel.lastFY<w.vppel.firstFY)m.push("V-PPEL last year before first year");}}
  if(need("debt"))w.debt.forEach((d,i)=>{if(!d.lastFY)m.push(`final year for “${d.name||"obligation "+(i+1)}”`);});
  const nums=[];(function walk(o,p){for(const k in o){const v=o[k];if(typeof v==="number"&&isNaN(v))nums.push(p+k);else if(v&&typeof v==="object")walk(v,p+k+".");}})(w,"");
  if(nums.length)m.push("a number that couldn't be read ("+nums.join(", ")+")");
  return m;
}
function countPhasesBefore(k){
  let n=0;const cnt=list=>list.forEach(p=>p.phases.forEach(ph=>{if(ph.year<k)n++;}));
  cnt(DOC.projects);DOC.scenarios.forEach(s=>cnt(s.projects));return n;
}
/* keep every phase in its fiscal year when the start year moves */
function shiftDocYears(d,k){
  const sh=list=>list.map(p=>Object.assign(p,{phases:p.phases.map(ph=>Object.assign(ph,{year:ph.year-k})).filter(ph=>ph.year>=0)}))
    .filter(p=>p.phases.length);
  d.projects=sh(d.projects);d.scenarios.forEach(s=>{s.projects=sh(s.projects);});
}

const SB={on:false,missing:false,url:SUPABASE_URL,key:SUPABASE_KEY,token:null,refresh:null,exp:0,email:null,member:null,

const sbHead=jwt=>{const h={apikey:SB.key,"Content-Type":"application/json"};if(jwt)h.Authorization="Bearer "+jwt;return h;};
async function sbGet(path,jwt){const r=await fetch(SB.url+"/rest/v1/"+path,{headers:sbHead(jwt),cache:"no-store"});
  if(!r.ok){const t=(await r.text()).slice(0,160);const e=new Error("HTTP "+r.status+" "+t);e.status=r.status;e.body=t;throw e;}return r.json();}

async function sbWrite(doc){

    headers:Object.assign(sbHead(SB.token),{Prefer:"resolution=merge-duplicates,return=representation"}),
    body:JSON.stringify({id:TID,doc:doc,updated_at:nowIso()})});

    if(r.status===401)throw new Error("your sign-in expired and couldn't be renewed — sign in again");
    if(r.status===403||/row-level security|42501/.test(t))throw new Error("you're signed in, but not listed as an editor for this district");
    throw new Error(r.status+" "+t);}

async function sbSend(method,path,body){

function sbSaveSession(s){SB.token=s.access;SB.refresh=s.refresh||SB.refresh;SB.exp=s.exp||0;
  lsSet(SESS_KEY,{access:SB.token,refresh:SB.refresh,exp:SB.exp});}

function sbHashError(){
  const h=location.hash||"";if(!/error=/.test(h))return null;
  const m=/error_code=([^&]*)/.exec(h),d=/error_description=([^&]*)/.exec(h);
  history.replaceState(null,"",location.pathname+location.search);
  return {code:m?decodeURIComponent(m[1]):"error",text:d?decodeURIComponent(d[1].replace(/\+/g," ")):""};

function sbGrabTokenFromHash(){
  const h=location.hash||"";const field=k=>{const m=new RegExp("[#&]"+k+"=([^&]*)").exec(h);return m?decodeURIComponent(m[1]):null;};

async function sbRefresh(){
  if(!SB.refresh)return false;
  try{const r=await fetch(SB.url+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:SB.key,"Content-Type":"application/json"},
      body:JSON.stringify({refresh_token:SB.refresh})});
    if(!r.ok)return false;const j=await r.json();if(!j||!j.access_token)return false;
    sbSaveSession({access:j.access_token,refresh:j.refresh_token||SB.refresh,exp:Date.now()+((j.expires_in||3600)*1000)});
    if(j.user&&j.user.email)SB.email=j.user.email;return true;}catch(e){return false;}
}
async function sbEnsureFresh(){if(!SB.token)return false;if(SB.exp&&Date.now()<SB.exp-120000)return true;return sbRefresh();}
async function sbSignIn(){ /* once per page load */
  const sess=sbGrabTokenFromHash()||sbLoadSession();
  if(!sess)return;
  SB.token=sess.access;SB.refresh=sess.refresh||null;SB.exp=sess.exp||0;
  if(SB.exp&&Date.now()>=SB.exp-120000)await sbRefresh();
  let who=await sbWhoAmI(SB.token);
  if(!who&&await sbRefresh())who=await sbWhoAmI(SB.token);

}
/* read this district's shared row; fall back to what's built in if it can't be reached */
async function sbBootTenant(){

  if(!sbConfigured()){SB.note="Shared saving is switched off in this copy.";SB.checked=true;return;}

    let row=await sbRead(tid);

          SB.legacy=true;}}catch(e){}
    }

  }catch(e){
